name: Notify LeetCode Viewer

on:
  push:
    branches:
      - main
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'  # Only triggers when a problem folder is added/updated

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Sync in leetcode-viewer
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.LEETCODE_SYNC_TOKEN }}" \
            https://api.github.com/repos/rohitkr7/leetcode-viewer/dispatches \
            -d '{"event_type":"leetcode-updated"}'
